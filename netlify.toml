[build]
  base = "."
  command = "node tools/build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  CONTROL_API_BASE_URL = "https://blindbalance-control.debutgacc.workers.dev"

[[headers]]
  for = "/control/*"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
